<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layouts/base :: content">

<main th:fragment="content" style="margin-top:75px; margin-bottom:40px;">
    <section class="p-0 d-flex align-items-center position-relative overflow-hidden">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12 col-lg-8 m-auto">
                    <div class="row my-5">
                        <div class="col-sm-10 col-xl-8 m-auto">

                            <h2>Welcome to the official No Go Outside server website!</h2>
                            <p class="lead mb-4">
                                Please log in to your account.
                            </p>

                            <div th:if="${param.loggedIn}"
                                 class="alert alert-success mb-2">
                                Login successful.
                            </div>

                            <div th:if="${errorMessage}"
                                 class="alert alert-danger mb-2"
                                 th:text="${errorMessage}">
                            </div>

                            <form th:action="@{/login}" method="post">
                                <!-- CSRF Token -->
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <!-- Email -->
                                <div class="mb-4">
                                    <label class="form-label" for="username">
                                        Email Address *
                                    </label>

                                    <div class="input-group input-group-lg">
                                        <span class="input-group-text bg-light rounded-start border-0 text-secondary px-3">
                                            <i class="bi bi-envelope-fill"></i>
                                        </span>

                                        <input type="email"
                                               id="username"
                                               name="username"
                                               class="form-control border-0 bg-light rounded-end ps-1"
                                               placeholder="E-mail"
                                               required>
                                    </div>
                                </div>

                                <!-- Password -->
                                <div class="mb-4">
                                    <label class="form-label" for="password">
                                        Password *
                                    </label>

                                    <div class="input-group input-group-lg">
                                        <span class="input-group-text bg-light rounded-start border-0 text-secondary px-3">
                                            <i class="fas fa-lock"></i>
                                        </span>

                                        <input type="password"
                                               id="password"
                                               name="password"
                                               class="form-control border-0 bg-light rounded-end ps-1"
                                               placeholder="*********"
                                               required>
                                    </div>
                                </div>

                                <!-- Submit -->
                                <div class="align-items-center mt-0">
                                    <div class="d-grid">
                                        <button class="btn btn-primary mb-0"
                                                type="submit">
                                            Log In
                                        </button>
                                    </div>
                                </div>

                            </form>

                            <div class="mt-4 text-center">
                                <span>
                                    Don't have an account?
                                    <a th:href="@{/register}">
                                        Register here
                                    </a>
                                </span>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
